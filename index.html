
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversion Video</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #050816; }
.banner {
    position: relative;
    min-height: 300px;
    padding: 45px 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: 2px solid #a65a28;
    border-radius: 18px;
    background:
        radial-gradient(circle at 15% 20%, #653015, transparent 40%),
        radial-gradient(circle at 85% 80%, #43165d, transparent 40%),
        linear-gradient(135deg, #050816, #201329, #080b1b);
}
.banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(#ffb34712 1px, transparent 1px),
        linear-gradient(90deg, #ffb34712 1px, transparent 1px);
    background-size: 35px 35px;
}
.content { position: relative; z-index: 1; }
.small { color: #ffd5a1; letter-spacing: 5px; font-size: 14px; margin-bottom: 22px; }
h1 {
    margin: 0;
    font-size: clamp(32px, 6.5vw, 68px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: linear-gradient(90deg,#ffb347,#fff,#ff4ecd,#a855f7,#ffb347);
    background-size: 300% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: flow 5s linear infinite;
    filter: drop-shadow(0 0 12px #ffb34755);
}
.tag {
    display: inline-block;
    margin-top: 25px;
    padding: 10px 22px;
    border: 1px solid #ffb34799;
    border-radius: 30px;
    color: #fff0db;
    letter-spacing: 3px;
    font-size: 13px;
}
.spark { position: absolute; color: #ffb347; font-size: 25px; animation: blink 2s infinite alternate; }
.s1 { top: 20%; left: 10%; }
.s2 { top: 25%; right: 12%; color: #ff4ecd; }
.s3 { bottom: 18%; left: 18%; color: #a855f7; }
.s4 { bottom: 20%; right: 18%; }
@keyframes flow { to { background-position: 300% center; } }
@keyframes blink {
    from { opacity: .3; transform: scale(.8); }
    to { opacity: 1; transform: scale(1.2); }
}
@media(max-width:500px) {
    .small { letter-spacing: 2px; }
    h1 { letter-spacing: 1px; }
    .tag { letter-spacing: 2px; }
}
</style>
</head>
<body>
<div class="banner">
    <span class="spark s1">✦</span>
    <span class="spark s2">✧</span>
    <span class="spark s3">✧</span>
    <span class="spark s4">✦</span>
    <div class="content">
        <div class="small">WATCH • UNDERSTAND • LEARN</div>
        <h1>CONVERSION VIDEO</h1>
        <div class="tag">LEARN IT VISUALLY</div>
    </div>
</div>
</body>
</html>
